<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Upload Source Code</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body
    class="bg-gray-100 text-gray-900 flex justify-center items-center min-h-screen"
  >
    <div class="bg-white shadow-xl rounded-lg p-8 w-full max-w-md">
      <h1 class="text-2xl font-bold text-center text-blue-600 mb-6">
        Upload Source Code
      </h1>
      <form
        action="upload_source_code.php"
        method="POST"
        enctype="multipart/form-data"
        class="space-y-4"
      >
        <div>
          <label for="title" class="block text-gray-700 font-medium"
            >Title:</label
          >
          <input
            type="text"
            id="title"
            name="title"
            required
            class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 focus:outline-none"
          />
        </div>

        <div>
          <label for="description" class="block text-gray-700 font-medium"
            >Description:</label
          >
          <textarea
            id="description"
            name="description"
            rows="4"
            required
            class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 focus:outline-none"
          ></textarea>
        </div>

        <div>
          <label for="price" class="block text-gray-700 font-medium"
            >Price (USD):</label
          >
          <input
            type="number"
            id="price"
            name="price"
            step="0.01"
            required
            class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 focus:outline-none"
          />
        </div>

        <div>
          <label for="file" class="block text-gray-700 font-medium"
            >Source Code File:</label
          >
          <input
            type="file"
            id="file"
            name="file"
            required
            class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 focus:outline-none"
          />
        </div>

        <div class="text-center">
          <button
            type="submit"
            class="bg-blue-600 text-white font-bold py-2 px-4 rounded-lg shadow hover:bg-blue-500 focus:ring-4 focus:ring-blue-300"
          >
            Upload
          </button>
        </div>
      </form>
    </div>
  </body>
</html>
